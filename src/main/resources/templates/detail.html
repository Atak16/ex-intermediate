<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野球チーム詳細</title>
</head>
<body>
    <p>
        <strong>球団名</strong><br>
        <span th:text="${central.teamName}"></span>
    </p>

    <p>
        <strong>本拠地</strong><br>
        <span th:text="${central.headquarters}"></span>
    </p>

    <p>
        <strong>発足</strong><br>
        <span th:text="${central.inauguration}"></span>
    </p>

    <p>
        <strong>歴史</strong><br>
        <span th:text="${central.history}"></span>
    </p>

    <form th:action="@{/central}" method="get">
        <button type="submit">戻る</button>
    </form>
</body>
</html>
