<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野球チーム一覧</title>
</head>
<body>
    <h1>野球チーム一覧</h1>
    <p th:each="team : ${teamList}">
        <a th:href="@{/central/detail/{id}(id=${team.id})}" th:text="${team.teamName}"></a>
    </p>
</body>
</html>
